
name: Compilar La Pauta Tune (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empaquetar VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" |
            Where-Object { $_.FullName -match "\\Release\\" } |
            Select-Object -First 1

          if (-not $vst3) {
            throw "No se encontró el plugin VST3"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $vst3.FullName "dist/$($vst3.Name)"

          Get-ChildItem dist

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Verificar Inno Setup
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )

          $iscc = $paths | Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $iscc) {
            throw "No se encontró ISCC.exe"
          }

          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Crear instalador
        shell: pwsh
        run: |
          $iss = "Installer/LaPautaTune.iss"

          if (-not (Test-Path $iss)) {
            throw "No existe Installer/LaPautaTune.iss"
          }

          & "$env:ISCC_PATH" "/ODist" $iss

          if ($LASTEXITCODE -ne 0) {
            throw "Falló Inno Setup"
          }

      - name: Verificar archivos
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/La-Pauta-Tune-Setup.exe")) {
            throw "No se generó el instalador"
          }

          Get-ChildItem dist

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-Tune-Instalador-Windows
          path: dist/La-Pauta-Tune-Setup.exe
          if-no-files-found: error

      - name: Subir plugin VST3
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-Tune-VST3-Windows
          path: dist/*.vst3
          if-no-files-found: error
