name: Compilar La Pauta Tune (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empaquetar VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "No se encontró el .vst3" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $vst3.FullName "dist/$($vst3.Name)"
          Get-ChildItem dist

      - name: Crear instalador
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "Installer\LaPautaTune.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falló Inno Setup" }
          Get-ChildItem dist

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-Tune-Instalador-Windows
          path: dist/La-Pauta-Tune-Setup.exe

      - name: Subir plugin VST3 (sin instalador)
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-Tune-VST3-Windows
          path: dist/*.vst3
